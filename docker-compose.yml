services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linea-jewelry
    ports:
      - "4545:4545"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4545/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - linea-network

networks:
  linea-network:
    driver: bridge
