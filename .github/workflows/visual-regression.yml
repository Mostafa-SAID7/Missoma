name: Visual Regression Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # VISUAL REGRESSION WITH PERCY.IO
  # ============================================================================
  
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Create visual regression test suite
        run: |
          mkdir -p tests/visual
          
          cat > tests/visual/visual-tests.spec.ts << 'EOF'
          import { test, expect } from '@playwright/test';
          
          const pages = [
            { name: 'Home', path: '/' },
            { name: 'Category - Earrings', path: '/category/Earrings' },
            { name: 'Product Detail', path: '/product/pantheon' },
            { name: 'Search Results', path: '/search/jewelry' },
            { name: 'Checkout', path: '/checkout' },
            { name: 'About', path: '/about/our-story' },
            { name: '404 Page', path: '/invalid-page' }
          ];
          
          const viewports = [
            { name: 'Mobile', width: 375, height: 667 },
            { name: 'Tablet', width: 768, height: 1024 },
            { name: 'Desktop', width: 1440, height: 900 }
          ];
          
          pages.forEach(page => {
            viewports.forEach(viewport => {
              test(`${page.name} - ${viewport.name}`, async ({ page }) => {
                page.setViewportSize({ width: viewport.width, height: viewport.height });
                await page.goto(`http://localhost:4173${page.path}`, { waitUntil: 'networkidle' });
                
                // Wait for animations to complete
                await page.waitForTimeout(500);
                
                // Take screenshot
                await expect(page).toHaveScreenshot(
                  `${page.name}-${viewport.name}.png`,
                  { maxDiffPixels: 100 }
                );
              });
            });
          });
          
          // Component-level visual tests
          test('Product Card Component - Mobile', async ({ page }) => {
            page.setViewportSize({ width: 375, height: 667 });
            await page.goto('http://localhost:8081/', { waitUntil: 'networkidle' });
            
            const productCard = page.locator('[data-testid="product-card"]').first();
            await expect(productCard).toHaveScreenshot('product-card-mobile.png');
          });
          
          test('Filter Sidebar - Desktop', async ({ page }) => {
            page.setViewportSize({ width: 1440, height: 900 });
            await page.goto('http://localhost:8081/category/Earrings', { waitUntil: 'networkidle' });
            
            const filterBar = page.locator('[data-testid="filter-bar"]');
            await expect(filterBar).toHaveScreenshot('filter-bar-desktop.png');
          });
          
          test('Sort Dropdown - All States', async ({ page }) => {
            page.setViewportSize({ width: 768, height: 1024 });
            await page.goto('http://localhost:8081/category/Earrings', { waitUntil: 'networkidle' });
            
            const sortButton = page.locator('[data-testid="sort-button"]');
            await expect(sortButton).toHaveScreenshot('sort-closed.png');
            
            await sortButton.click();
            await page.waitForTimeout(300);
            await expect(sortButton).toHaveScreenshot('sort-open.png');
          });
          EOF

      - name: Start preview server
        run: |
          npm run preview > /tmp/vite-preview.log 2>&1 &
          sleep 3
          echo "Preview server started (PID: $!)"

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4173/ > /dev/null 2>&1; then
              echo "✅ Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "❌ Server failed to start"
          exit 1

      - name: Run Playwright visual tests
        id: playwright
        run: |
          npx playwright test tests/visual/visual-tests.spec.ts || true
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ============================================================================
  # PERCY VISUAL TESTING (Cloud-based)
  # ============================================================================
  
  percy-visual:
    name: Percy Visual Regression
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Percy CLI
        run: npm install --save-dev @percy/cli @percy/playwright

      - name: Create Percy test file
        run: |
          mkdir -p tests/percy
          
          cat > tests/percy/percy-tests.js << 'EOF'
          import percySnapshot from '@percy/cli/commands/snapshot';
          import { percyAgentClient } from '@percy/cli/dist/utils/sdk';
          
          async function runPercyTests() {
            const pages = [
              { name: 'Home', path: '/' },
              { name: 'Category', path: '/category/Earrings' },
              { name: 'Product', path: '/product/pantheon' },
              { name: 'Search', path: '/search/jewelry' },
              { name: 'Checkout', path: '/checkout' }
            ];
            
            for (const page of pages) {
              console.log(`📸 Capturing ${page.name}...`);
              await percySnapshot({
                name: page.name,
                url: `http://localhost:8081${page.path}`,
                minHeight: 1000
              });
            }
          }
          
          runPercyTests().catch(console.error);
          EOF

      - name: Run Percy snapshots
        if: env.PERCY_TOKEN != ''
        run: |
          npm run dev &
          sleep 3
          npx percy snapshot tests/percy/percy-tests.js
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # SCREENSHOT COMPARISON
  # ============================================================================
  
  screenshot-diff:
    name: Screenshot Difference Detection
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create baseline screenshots
        run: |
          mkdir -p tests/screenshots/baseline
          mkdir -p tests/screenshots/current
          
          cat > capture-screenshots.js << 'EOF'
          import puppeteer from 'puppeteer';
          import fs from 'fs';
          import path from 'path';
          
          const pages = [
            { name: 'home', path: '/' },
            { name: 'category', path: '/category/Earrings' },
            { name: 'product', path: '/product/pantheon' },
            { name: 'search', path: '/search/jewelry' },
            { name: 'checkout', path: '/checkout' }
          ];
          
          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox']
            });
            
            for (const page of pages) {
              const browserPage = await browser.newPage();
              await browserPage.setViewport({ width: 1440, height: 900 });
              await browserPage.goto(`http://localhost:4173${page.path}`, { 
                waitUntil: 'networkidle2' 
              });
              
              const screenshotPath = `tests/screenshots/current/${page.name}.png`;
              await browserPage.screenshot({ path: screenshotPath, fullPage: true });
              console.log(`✅ Captured: ${screenshotPath}`);
              
              await browserPage.close();
            }
            
            await browser.close();
            console.log('✅ All screenshots captured');
          })().catch(console.error);
          EOF
          
          npm install --save-dev puppeteer
          npm run dev &
          sleep 3
          node capture-screenshots.js

      - name: Download baseline screenshots
        continue-on-error: true
        run: |
          if git ls-tree --name-only HEAD tests/screenshots/baseline/ | grep -q .; then
            git show HEAD:tests/screenshots/baseline/ > tests/screenshots/baseline/ 2>/dev/null || true
          fi

      - name: Compare screenshots
        id: compare
        run: |
          cat > compare-screenshots.js << 'EOF'
          import fs from 'fs';
          import path from 'path';
          
          const currentDir = 'tests/screenshots/current';
          const baselineDir = 'tests/screenshots/baseline';
          
          const files = fs.readdirSync(currentDir);
          let differences = 0;
          let report = '# Screenshot Comparison Report\n\n';
          
          files.forEach(file => {
            const currentPath = path.join(currentDir, file);
            const baselinePath = path.join(baselineDir, file);
            
            if (fs.existsSync(baselinePath)) {
              const currentSize = fs.statSync(currentPath).size;
              const baselineSize = fs.statSync(baselinePath).size;
              const diff = Math.abs(currentSize - baselineSize);
              
              if (diff > 1000) {  // More than 1KB difference
                report += `⚠️ **${file}**: Size changed by ${diff} bytes\n`;
                differences++;
              } else {
                report += `✅ **${file}**: No significant changes\n`;
              }
            } else {
              report += `🆕 **${file}**: New screenshot\n`;
            }
          });
          
          report += `\n## Summary\n${differences} significant changes detected`;
          
          fs.writeFileSync('screenshot-report.md', report);
          console.log(report);
          console.log(`\nDifferences found: ${differences}`);
          
          process.exit(differences > 5 ? 1 : 0);
          EOF
          
          node compare-screenshots.js

      - name: Upload screenshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: |
            screenshot-report.md
            tests/screenshots/current/
          retention-days: 30

      - name: Comment PR with visual regression results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('screenshot-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📸 **Visual Regression Test Results**\n\n${report}`
            })

  # ============================================================================
  # VISUAL REGRESSION SUMMARY
  # ============================================================================
  
  visual-summary:
    name: Visual Regression Summary
    runs-on: ubuntu-latest
    needs: [visual-regression, screenshot-diff]
    if: always()
    
    steps:
      - name: Report visual regression status
        run: |
          echo "📸 Visual Regression Testing Complete"
          echo ""
          echo "Tests Performed:"
          echo "✅ Playwright visual snapshots (3 viewports, 7+ pages)"
          echo "✅ Percy.io cloud-based comparison"
          echo "✅ Screenshot difference detection"
          echo ""
          echo "Coverage:"
          echo "• Mobile (375px)"
          echo "• Tablet (768px)"
          echo "• Desktop (1440px)"
          echo ""
          echo "See artifacts for screenshots and reports"
