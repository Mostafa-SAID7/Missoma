name: Performance Benchmarking

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'

jobs:
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview > /tmp/vite-preview.log 2>&1 &
          sleep 3
          echo "Preview server started"

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4173/ > /dev/null 2>&1; then
              echo "✅ Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "❌ Server failed to start"
          exit 1

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: ./.github/lighthouse.json
          uploadArtifacts: false
          temporaryPublicStorage: false
        continue-on-error: true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse_results
          path: .lighthouseci/
        continue-on-error: true

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Analyze bundle size
        id: bundlesize
        run: |
          JS_SIZE=$(du -sh dist/assets/*.js 2>/dev/null | awk '{print $1}' | tail -1 || echo "0")
          CSS_SIZE=$(du -sh dist/assets/*.css 2>/dev/null | awk '{print $1}' | tail -1 || echo "0")
          TOTAL_SIZE=$(du -sh dist/ | awk '{print $1}')

          echo "js-size=$JS_SIZE" >> $GITHUB_OUTPUT
          echo "css-size=$CSS_SIZE" >> $GITHUB_OUTPUT
          echo "total-size=$TOTAL_SIZE" >> $GITHUB_OUTPUT

          echo "📦 Bundle Sizes:"
          echo "• JavaScript: $JS_SIZE"
          echo "• CSS: $CSS_SIZE"
          echo "• Total: $TOTAL_SIZE"

      - name: Save bundle metrics
        run: |
          cat > dist/bundle-metrics.json << EOF
          {
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "jsSize": "${{ steps.bundlesize.outputs.js-size }}",
            "cssSize": "${{ steps.bundlesize.outputs.css-size }}",
            "totalSize": "${{ steps.bundlesize.outputs.total-size }}",
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle_report
          path: dist/bundle-metrics.json
        continue-on-error: true

  runtime-performance:
    name: Runtime Performance Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install puppeteer
        run: npm install --save-dev puppeteer

      - name: Run performance tests
        id: perf-test
        run: |
          cat > perf-test.js << 'EOF'
          import puppeteer from 'puppeteer';

          (async () => {
            const browser = await puppeteer.launch();
            const page = await browser.newPage();

            const metrics = {};
            const startHome = Date.now();
            await page.goto('http://localhost:4173/', { waitUntil: 'networkidle2' });
            metrics.homePageLoadTime = Date.now() - startHome;

            await browser.close();
            console.log(JSON.stringify(metrics, null, 2));
          })().catch(console.error);
          EOF

          npm run preview > /tmp/server.log 2>&1 &
          sleep 5
          node perf-test.js > perf-results.json 2>&1 || echo "{}" > perf-results.json
          cat perf-results.json

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance_report
          path: perf-results.json
        continue-on-error: true

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, bundle-analysis, runtime-performance]
    if: always()

    steps:
      - name: Report performance check
        run: |
          echo "✅ Performance benchmarking workflow completed"
          echo "📊 Artifacts uploaded for review"
