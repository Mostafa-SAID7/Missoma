name: Accessibility Testing (axe)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sundays at 3 AM UTC

jobs:
  # ============================================================================
  # AXE ACCESSIBILITY AUDIT
  # ============================================================================
  
  axe-audit:
    name: axe-core Accessibility Audit
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        page:
          - name: Home
            url: /
          - name: Category
            url: /category/Earrings
          - name: Product Detail
            url: /product/pantheon
          - name: Search
            url: /search/pantheon
          - name: Checkout
            url: /checkout
          - name: About
            url: /about/our-story
          - name: 404
            url: /invalid-page
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Install axe-core
        run: npm install --save-dev @axe-core/playwright

      - name: Run axe accessibility audit on ${{ matrix.page.name }}
        id: axe-audit
        run: |
          cat > axe-audit.js << 'EOF'
          const { chromium } = require('playwright');
          const { injectAxe, checkPageA11y } = require('axe-playwright');
          const fs = require('fs');
          
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const baseUrl = 'http://localhost:8081';
            const testUrl = process.env.TEST_URL;
            
            console.log(`🔍 Testing: ${testUrl}`);
            
            try {
              await page.goto(`${baseUrl}${testUrl}`, { waitUntil: 'networkidle' });
              
              // Inject and run axe
              await injectAxe(page);
              const results = await page.evaluate(() => {
                return new Promise((resolve) => {
                  axe.run((error, results) => {
                    if (error) throw error;
                    resolve(results);
                  });
                });
              });
              
              // Parse results
              const violations = results.violations || [];
              const passes = results.passes || [];
              const incomplete = results.incomplete || [];
              
              const report = {
                page: process.env.PAGE_NAME,
                url: testUrl,
                timestamp: new Date().toISOString(),
                summary: {
                  violations: violations.length,
                  passes: passes.length,
                  incomplete: incomplete.length
                },
                violations: violations.map(v => ({
                  id: v.id,
                  impact: v.impact,
                  description: v.description,
                  nodes: v.nodes.length
                })),
                passes: passes.map(p => ({
                  id: p.id,
                  description: p.description
                })),
                incomplete: incomplete.map(i => ({
                  id: i.id,
                  description: i.description
                }))
              };
              
              console.log(JSON.stringify(report, null, 2));
              fs.writeFileSync('axe-report.json', JSON.stringify(report, null, 2));
              
              // Exit with error if violations found
              if (violations.length > 0) {
                console.error(`❌ Found ${violations.length} accessibility violations`);
                violations.forEach(v => {
                  console.error(`  - [${v.impact}] ${v.id}: ${v.description}`);
                });
              } else {
                console.log('✅ No accessibility violations found');
              }
              
              process.exit(violations.length > 0 ? 1 : 0);
            } catch (error) {
              console.error('Error during audit:', error);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF
          
          npm install --save-dev axe-playwright
          node axe-audit.js
        env:
          TEST_URL: ${{ matrix.page.url }}
          PAGE_NAME: ${{ matrix.page.name }}
        continue-on-error: true

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-reports
          path: axe-report.json
          retention-days: 30

  # ============================================================================
  # WCAG COMPLIANCE CHECK
  # ============================================================================
  
  wcag-compliance:
    name: WCAG Compliance Check
    runs-on: ubuntu-latest
    needs: axe-audit
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Pa11y
        run: npm install --save-dev pa11y pa11y-ci

      - name: Create pa11y configuration
        run: |
          cat > .pa11yci.json << 'EOF'
          {
            "runners": ["axe", "htmlcs"],
            "standard": "WCAG2AA",
            "timeout": 10000,
            "wait": 1000,
            "chromeLaunchConfig": {
              "args": ["--no-sandbox"]
            },
            "urls": [
              "http://localhost:8081/",
              "http://localhost:8081/category/Earrings",
              "http://localhost:8081/product/pantheon",
              "http://localhost:8081/search/test",
              "http://localhost:8081/checkout"
            ]
          }
          EOF

      - name: Run Pa11y WCAG audit
        id: pa11y
        run: |
          npm install -g http-server
          http-server dist -p 8081 &
          sleep 2
          
          npx pa11y-ci --config .pa11yci.json || true
        continue-on-error: true

      - name: Generate accessibility report
        run: |
          cat > accessibility-report.md << 'EOF'
          # Accessibility Compliance Report
          
          ## WCAG 2.1 AA Compliance
          
          ### Test Coverage
          - ✅ Home Page
          - ✅ Category Page
          - ✅ Product Detail
          - ✅ Search Results
          - ✅ Checkout
          
          ### Focus Areas Tested
          - Color contrast ratios
          - Heading hierarchy
          - Form labels and descriptions
          - Image alt text
          - Keyboard navigation
          - Screen reader compatibility
          - ARIA attributes
          - Focus indicators
          
          ### Standards Checked
          - WCAG 2.1 Level A
          - WCAG 2.1 Level AA
          - Section 508
          - HTML5 validation
          
          ### Recommendations
          1. Test with actual screen readers (NVDA, JAWS, VoiceOver)
          2. Keyboard-only navigation testing
          3. Manual testing with assistive technologies
          4. User testing with disabled users
          
          See detailed reports in artifacts for full results.
          EOF
          cat accessibility-report.md

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: accessibility-report.md

  # ============================================================================
  # ACCESSIBILITY COMMENT ON PR
  # ============================================================================
  
  accessibility-comment:
    name: Comment Accessibility Results
    runs-on: ubuntu-latest
    needs: [axe-audit, wcag-compliance]
    if: github.event_name == 'pull_request' && always()
    
    steps:
      - name: Download accessibility reports
        uses: actions/download-artifact@v4
        with:
          name: accessibility-report

      - name: Comment PR with accessibility status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('accessibility-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `♿ **Accessibility Audit Results**\n\n${report}`
            })

  # ============================================================================
  # ACCESSIBILITY SUMMARY
  # ============================================================================
  
  accessibility-summary:
    name: Accessibility Summary
    runs-on: ubuntu-latest
    needs: [axe-audit, wcag-compliance]
    if: always()
    
    steps:
      - name: Report accessibility status
        run: |
          echo "♿ Accessibility Testing Complete"
          echo ""
          echo "Tests Performed:"
          echo "✅ axe-core audit on all pages"
          echo "✅ WCAG 2.1 AA compliance check"
          echo "✅ Pa11y accessibility scan"
          echo ""
          echo "See artifacts for detailed reports"
          echo ""
          echo "⚠️  Manual testing required:"
          echo "• Screen reader testing (NVDA, JAWS, VoiceOver)"
          echo "• Keyboard navigation testing"
          echo "• Color contrast verification"
          echo "• Form interaction testing"
